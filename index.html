<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <title>Pesquisa Culturama</title>
</head>

<body>
    <header>
        <img src="img/logo-culturama.png" alt="Logo Culturama">
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                
                <legend>Dados Pessoais</legend>
                <label for="name">Nome</label>
                <input id="name" type="text" name="userName" placeholder="Digite seu nome" required>
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" name="userAge" min="12" max="100" placeholder="Digite sua idade" required>
                <br>
                <label for="birthDate">Data de Nascimento</label>
                <input id="birthDate" type="date" name="userBirthDate">
                <br>
                <label for="email">E-mail</label>
                <input id="email" type="email" name="userEmail" placeholder="Digite seu e-mail" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + 9****-****" required>
                <br>
                <label for="image">Upload de Imagem</label>
                <input id="image" type="file" name="userImage" accept="image/*">
                <br>

            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <label for="userGenero">Gênero:</label>
                <input id="masc" type="radio" name="userGenero" value="masculino">
                <label for="masc">Masculino</label>
                
                <input id="fem" type="radio" name="userGenero" value="feminino">
                <label for="fem">Feminino</label>
                
                <input id="naoInformar" type="radio" name="userGenero" value="naoInformar">
                <label for="naoInformar">Prefiro Não Informar</label>
                <br>

                <label for="estadoCivil">Estado Civil:</label>
                <select id="estadoCivil" name="userEstadoCivil">
                    <option value="naoInformado">Selecione...</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="casado">Casado</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="viuvo">Viúvo</option>
                    <option value="uniaoEstavel">União Estável</option>
                </select>
                <br>

                <label for="estado">Estado:</label>
                <select id="estado" name="userEstado" required>
                    <option value="naoInformado">Selecione...</option>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                <br>

                <label for="cidade">Cidade</label>
                <input id="cidade" type="text" name="userCidade" autocomplete="address-level2" placeholder="Digite o nome da sua cidade">
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>

                <p>Redes Sociais:</p>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>

                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>

                <input id="twitter" type="checkbox" name="social" value="twitter">
                <label for="twitter">Twitter</label>
                <br>

                <input id="tiktok" type="checkbox" name="social" value="tiktok">
                <label for="tiktok">TikTok</label>
                <br>

                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">LinkedIn</label>
                <br>

                <label for="musicStyle">Estilo Musical:</label>
                <input id="musicStyle" type="text" name="userMusicStyle" list="styleTypes" placeholder="Ex: Rock">
                <datalist id="styleTypes">
                    <option value="Pop">
                    <option value="Rock">
                    <option value="Sertanejo">
                    <option value="Funk">
                    <option value="MPB">
                    <option value="Eletrônica">
                    <option value="Hip-Hop">
                    <option value="Forró">
                    <option value="Pagode">
                    <option value="Axé">
                </datalist><br>

                <label for="favoriteColor">Cor Favorita:</label>
                <input id="favoriteColor" type="color" name="userFavoriteColor">
            </fieldset>

            <fieldset>
                <legend>Opniões</legend>
                <label for="userServiceOpinion">O que você acha da qualidade do nosso serviço?</label>
                <input type="radio" name="userServiceOpinion" id="otima" value="otima">
                <label for="otima">Ótima</label>
                <input type="radio" name="userServiceOpinion" id="boa" value="boa">
                <label for="boa">Boa</label>
                <input type="radio" name="userServiceOpinion" id="regular" value="regular">
                <label for="regular">Regular</label>
                <input type="radio" name="userServiceOpinion" id="ruim" value="ruim">
                <label for="ruim">Ruim</label><br>

                <p>Escreva sua opinião:</p>
                <textarea id="comment" name="userComment" rows="4" cols="50" placeholder="Deixe seus comentários aqui..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>
                
                <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="confirmacao" required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa</label><br>

                <input type="checkbox" name="userGetResult" id="getResult" value="confirmacao">
                <label for="getResult">Desejo receber o resultado por e-mail</label>
            </fieldset>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>

        </form>
    </section>

</body>

</html>
